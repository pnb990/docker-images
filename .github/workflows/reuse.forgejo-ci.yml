---

"on":
  push:

jobs:
  reuse:
    # TODO: once the python3 images are republished, run this in
    # `container: image: <registry>/python3:ci-<commit>` and drop the uv
    # install step below.
    runs-on: PIPENV
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Install uv
        run: |
          set -e
          apt-get update
          apt-get install -y --no-install-recommends wget ca-certificates
          wget -qO /tmp/uv-install.sh https://astral.sh/uv/install.sh
          env UV_INSTALL_DIR=/usr/local/bin UV_NO_MODIFY_PATH=1 \
              sh /tmp/uv-install.sh
          rm /tmp/uv-install.sh
          uv --version

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check REUSE compliance
        run: uv run reuse lint
