  build-images:
    runs-on: host

    # needs:
    #   - prepare

    strategy:
      # Sequential on purpose: `base` populates the build cache that `ci` and
      # `dev` then reuse, which is what keeps the 1.2 GB toolchain layer
      # shared between the three variants instead of pushed three times.
      max-parallel: 1

      matrix:
        # Explicit pairs, not a cross product: python3 has no `dev` variant.
        # The pairs are the `name`/`variant` fields of images/images_list.json;
        # keep them in sync (a dynamic matrix needs a `prepare` job, see the
        # commented block above).
        include:
          - name: "fw-arm-none-eabi-13.2.rel1"
            variant: base
          - name: "fw-arm-none-eabi-13.2.rel1"
            variant: ci
          - name: "fw-arm-none-eabi-13.2.rel1"
            variant: dev
          # Right after `dev`, whose layers it extends: the cache entry it
          # needs is the one the previous job has just written.
          - name: "fw-arm-none-eabi-13.2.rel1"
            variant: dev-x11
          # Extends dev-x11, so it follows it for the same reason.
          - name: "fw-arm-none-eabi-13.2.rel1"
            variant: dev-pyqt6
          - name: "fw-arm-none-eabi-13.2.rel1"
            variant: doc
          - name: "python3"
            variant: base
          - name: "python3"
            variant: ci

    steps:
      - name: Debug matrix
        run: |
          echo "matrix.name=${{ matrix.name }}"
          echo "matrix.variant=${{ matrix.variant }}"

      # buildx keeps its builder state in $DOCKER_CONFIG/buildx, and the login
      # writes its credentials there. Every step must see the same directory:
      # when only the login and build steps had it, `Setup Docker Buildx`
      # wrote to ~/.docker, the build step found no builder and fell back to
      # the `docker` driver, which cannot export a cache.
      #
      # Exported here rather than in the job `env:` because the `runner`
      # context is not available at that level.
      - name: Setup docker config dir
        run: echo "DOCKER_CONFIG=${RUNNER_TEMP:-/tmp}/docker" >> "$FORGEJO_ENV"

      # fetch-depth 0, the full history, and it is not an optimisation to
      # revisit: the step below asks `git log -- <file>` which commit last
      # touched a Dockerfile, and that question needs commits to walk back
      # through. At the default depth of 1 the clone holds exactly HEAD, so
      # the only answer it can give is HEAD -- which is what happened for
      # months: every push to master republished a new immutable tag for a
      # byte-identical image, and the tag every project pins, ci-6768dd9, is a
      # merge commit that never touched python3.ci.Dockerfile.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # docker-container, not the default `docker` driver: exporting a
      # registry cache is only supported by the former.
      #
      # `id` so the cleanup step at the end of the job can name the builder
      # this created: the action generates a fresh `builder-<uuid>` per job
      # and only its own outputs know which one.
      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Get commit hash for Dockerfile
        id: file_commit
        run: |
          set -e

          file="images/${{ matrix.name }}.${{ matrix.variant }}.Dockerfile"

          # The commit that last touched this Dockerfile, not HEAD: it is the
          # identity of the image content, so the immutable `-<commit>` tag
          # stays the same across pushes that do not change the image.
          file_commit=$(git log -n 1 --format=%H -- "$file")
          # Two forms of the same commit date, one per consumer, and both
          # taken from the commit rather than from `date`: a build time would
          # change on every rebuild and destroy the very property the line
          # above exists for.
          #
          #   file_date      YYYYMMDD, for the image tag -- a tag may not
          #                  contain ':' or '+', and it is read by eye;
          #   file_date_iso  RFC 3339, for /etc/image-info and for the
          #                  org.opencontainers.image.created label, which the
          #                  OCI spec defines as an RFC 3339 date-time.
          file_date=$(git log -n 1 --format=%cs "$file_commit" | tr -d '-')
          file_date_iso=$(git log -n 1 --format=%cI "$file_commit")
          branch_head=$(git rev-parse HEAD)
          branch_name="$FORGEJO_REF_NAME"

          # The moving tags describe what the default branch currently says an
          # image is, so the only question is which branch is building. It used
          # to be `file_commit = branch_head`, which was wrong twice: a push of
          # several commits whose Dockerfile change is not the head commit left
          # `-latest` frozen on the previous image forever, and a work branch
          # whose head commit did touch a Dockerfile published `-latest` from
          # outside the default branch.
          if [ "$branch_name" = "$DEFAULT_BRANCH" ]; then
            is_latest=true
          else
            is_latest=false
          fi

          echo "file_commit=$file_commit" >> "$FORGEJO_OUTPUT"
          echo "file_date=$file_date" >> "$FORGEJO_OUTPUT"
          echo "file_date_iso=$file_date_iso" >> "$FORGEJO_OUTPUT"
          echo "branch_name=$branch_name" >> "$FORGEJO_OUTPUT"
          echo "is_latest=$is_latest" >> "$FORGEJO_OUTPUT"
          echo "dockerfile=$file" >> "$FORGEJO_OUTPUT"

          echo "Dockerfile commit : $file_commit"
          echo "Dockerfile date   : $file_date_iso"
          echo "Branch head       : $branch_head"
          echo "Branch            : $branch_name"
          echo "Default branch    : $DEFAULT_BRANCH"
          echo "Is latest         : $is_latest"

      - name: Set image tags
        id: img
        run: |
          set -e

          name="${{ matrix.name }}"
          variant="${{ matrix.variant }}"
          commit="${{ steps.file_commit.outputs.file_commit }}"
          date="${{ steps.file_commit.outputs.file_date }}"

          repo="$IMAGE_NAMESPACE/$name"

          # A docker tag cannot contain a slash, and branch names do:
          # `tmp/review_image_building` would give the invalid tag
          # `base-tmp/review_image_building`.
          branch=$(printf '%s' "$FORGEJO_REF_NAME" | tr '/' '-')

          # Four kinds of tag:
          #   -<date>-<commit>  immutable, what consumers pin;
          #   -<commit>         the same image, without the date, kept so the
          #                     pins written before the date existed keep
          #                     resolving;
          #   -<branch>         per branch, so a work branch can be tried out;
          #   -latest and the bare <variant> alias, moving, default branch
          #                     only -- a work branch must never be able to
          #                     move what the other repositories consume.
          #
          # The date is there because a commit hash has no order. Two pins
          # cannot be compared by eye, and the question a pin raises is always
          # "am I behind?" -- which `ci-20260822-53142d0...` answers at a
          # glance and `ci-53142d0...` does not. It is the commit's own date,
          # so an unchanged image keeps the same tag, exactly like the hash.
          {
            echo "tags<<EOF"
            echo "$repo:${variant}-$branch"
            echo "$repo:${variant}-${date}-$commit"
            echo "$repo:${variant}-$commit"
            if [ "${{ steps.file_commit.outputs.is_latest }}" = 'true' ]; then
              echo "$repo:${variant}"
              echo "$repo:${variant}-latest"
            fi
            echo "EOF"
          } >> "$FORGEJO_OUTPUT"

          echo "tags:"
          echo "  $repo:${variant}-$branch"
          echo "  $repo:${variant}-${date}-$commit"
          echo "  $repo:${variant}-$commit"
          if [ "${{ steps.file_commit.outputs.is_latest }}" = 'true' ]; then
            echo "  $repo:${variant}"
            echo "  $repo:${variant}-latest"
          fi

      - name: Login to Docker Hubs
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build & Push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ steps.file_commit.outputs.dockerfile }}
          push: true
          tags: ${{ steps.img.outputs.tags }}
          # Stamped into /etc/image-info by the last layer of every Dockerfile.
          # Without it a job running on a floating tag leaves no trace of the
          # image it ran in, and a green run cannot be turned back into a pin.
          build-args: |
            IMAGE_COMMIT=${{ steps.file_commit.outputs.file_commit }}
            IMAGE_DATE=${{ steps.file_commit.outputs.file_date_iso }}
          # Identical instructions do not produce identical layers: a rebuilt
          # layer gets a fresh digest and is stored again. Only a cache hit
          # makes buildkit reuse the very same blob, so the variants share
          # their common prefix through this cache, one entry per image name.
          cache-from: >-
            type=registry,ref=${{ env.IMAGE_NAMESPACE }}/${{
            matrix.name }}:buildcache
          cache-to: >-
            type=registry,mode=max,ref=${{ env.IMAGE_NAMESPACE }}/${{
            matrix.name }}:buildcache

      # Every job creates its own builder above, and each one costs a
      # buildkitd container plus a `buildx_buildkit_<name>_state` volume. The
      # action has a post-step meant to remove it; it did not. 71 of them
      # accumulated to 101.6 GB, filled /var, and took PostgreSQL down on
      # 2026-08-25 with a checkpointer PANIC on ENOSPC. This step no longer
      # depends on that post-step running.
      #
      # An 8-image matrix on `on: push` with no branch filter leaks 8 builders
      # per push when it goes wrong, which is how it got to 71 in nine pushes.
      #
      # `always()` is the whole point: without it the step is skipped in
      # exactly the case that leaks, a failed build -- every orphaned builder
      # container was in `Exited (1)`. `|| true` keeps a failed cleanup from
      # failing a build that otherwise passed.
      - name: Remove the buildx builder
        if: always()
        run: docker buildx rm --force "${{ steps.buildx.outputs.name }}" || true
