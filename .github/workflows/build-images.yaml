  #           echo "No changes to commit"
  #         fi


  build-images:
    runs-on: host

    # needs:
    #   - prepare

    strategy:
      # Sequential on purpose: `base` populates the build cache that `ci` and
      # `dev` then reuse, which is what keeps the 1.2 GB toolchain layer
      # shared between the three variants instead of pushed three times.
      max-parallel: 1

      matrix:
        # Explicit pairs, not a cross product: python3 has no `dev` variant.
        # The pairs are the `name`/`variant` fields of images/images_list.json;
        # keep them in sync (a dynamic matrix needs a `prepare` job, see the
        # commented block above).
        include:
          - name: "fw-arm-none-eabi-13.2.rel1"
            variant: base
          - name: "fw-arm-none-eabi-13.2.rel1"
            variant: ci
          - name: "fw-arm-none-eabi-13.2.rel1"
            variant: dev
          # Right after `dev`, whose layers it extends: the cache entry it
          # needs is the one the previous job has just written.
          - name: "fw-arm-none-eabi-13.2.rel1"
            variant: dev-x11
          - name: "fw-arm-none-eabi-13.2.rel1"
            variant: doc
          - name: "python3"
            variant: base
          - name: "python3"
            variant: ci

    steps:
      - name: Debug matrix
        run: |
          echo "matrix.name=${{ matrix.name }}"
          echo "matrix.variant=${{ matrix.variant }}"

      # buildx keeps its builder state in $DOCKER_CONFIG/buildx, and the login
      # writes its credentials there. Every step must see the same directory:
      # when only the login and build steps had it, `Setup Docker Buildx`
      # wrote to ~/.docker, the build step found no builder and fell back to
      # the `docker` driver, which cannot export a cache.
      #
      # Exported here rather than in the job `env:` because the `runner`
      # context is not available at that level.
      - name: Setup docker config dir
        run: echo "DOCKER_CONFIG=${RUNNER_TEMP:-/tmp}/docker" >> "$FORGEJO_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4

      # docker-container, not the default `docker` driver: exporting a
      # registry cache is only supported by the former.
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Get commit hash for Dockerfile
        id: file_commit
        run: |
          set -e

          file="images/${{ matrix.name }}.${{ matrix.variant }}.Dockerfile"

          # The commit that last touched this Dockerfile, not HEAD: it is the
          # identity of the image content, so the immutable `-<commit>` tag
          # stays the same across pushes that do not change the image.
          file_commit=$(git log -n 1 --format=%H -- "$file")
          branch_head=$(git rev-parse HEAD)
          branch_name="$FORGEJO_REF_NAME"

          # The moving tags describe what the default branch currently says an
          # image is, so the only question is which branch is building. It used
          # to be `file_commit = branch_head`, which was wrong twice: a push of
          # several commits whose Dockerfile change is not the head commit left
          # `-latest` frozen on the previous image forever, and a work branch
          # whose head commit did touch a Dockerfile published `-latest` from
          # outside the default branch.
          if [ "$branch_name" = "$DEFAULT_BRANCH" ]; then
            is_latest=true
          else
            is_latest=false
          fi

          echo "file_commit=$file_commit" >> "$FORGEJO_OUTPUT"
          echo "branch_name=$branch_name" >> "$FORGEJO_OUTPUT"
          echo "is_latest=$is_latest" >> "$FORGEJO_OUTPUT"
          echo "dockerfile=$file" >> "$FORGEJO_OUTPUT"

          echo "Dockerfile commit : $file_commit"
          echo "Branch head       : $branch_head"
          echo "Branch            : $branch_name"
          echo "Default branch    : $DEFAULT_BRANCH"
          echo "Is latest         : $is_latest"

      - name: Set image tags
        id: img
        run: |
          set -e

          name="${{ matrix.name }}"
          variant="${{ matrix.variant }}"
          commit="${{ steps.file_commit.outputs.file_commit }}"

          repo="$IMAGE_NAMESPACE/$name"

          # A docker tag cannot contain a slash, and branch names do:
          # `tmp/review_image_building` would give the invalid tag
          # `base-tmp/review_image_building`.
          branch=$(printf '%s' "$FORGEJO_REF_NAME" | tr '/' '-')

          # Three kinds of tag:
          #   -<commit>  immutable, what consumers pin;
          #   -<branch>  per branch, so a work branch can be tried out;
          #   -latest and the bare <variant> alias, moving, default branch
          #             only -- a work branch must never be able to move what
          #             the other repositories consume.
          {
            echo "tags<<EOF"
            echo "$repo:${variant}-$branch"
            echo "$repo:${variant}-$commit"
            if [ "${{ steps.file_commit.outputs.is_latest }}" = 'true' ]; then
              echo "$repo:${variant}"
              echo "$repo:${variant}-latest"
            fi
            echo "EOF"
          } >> "$FORGEJO_OUTPUT"

          echo "tags:"
          echo "  $repo:${variant}-$branch"
          echo "  $repo:${variant}-$commit"
          if [ "${{ steps.file_commit.outputs.is_latest }}" = 'true' ]; then
            echo "  $repo:${variant}"
            echo "  $repo:${variant}-latest"
          fi

      - name: Login to Docker Hubs
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build & Push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ steps.file_commit.outputs.dockerfile }}
          push: true
          tags: ${{ steps.img.outputs.tags }}
          # Stamped into /etc/pnb-image by the last layer of every Dockerfile.
          # Without it a job running on a floating tag leaves no trace of the
          # image it ran in, and a green run cannot be turned back into a pin.
          build-args: |
            IMAGE_COMMIT=${{ steps.file_commit.outputs.file_commit }}
          # Identical instructions do not produce identical layers: a rebuilt
          # layer gets a fresh digest and is stored again. Only a cache hit
          # makes buildkit reuse the very same blob, so the variants share
          # their common prefix through this cache, one entry per image name.
          cache-from: >-
            type=registry,ref=${{ env.IMAGE_NAMESPACE }}/${{
            matrix.name }}:buildcache
          cache-to: >-
            type=registry,mode=max,ref=${{ env.IMAGE_NAMESPACE }}/${{
            matrix.name }}:buildcache
