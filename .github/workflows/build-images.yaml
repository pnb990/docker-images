---
name: build-docker-image

"on":
  push:

env:
  # The namespace is public, it is not a secret: putting it in `secrets` only
  # masked it in the logs, which made an invalid reference impossible to
  # diagnose. The secrets below are still used, for the login only.
  # Moving to another registry (phase 4) is a change to this single line.
  IMAGE_NAMESPACE: pnb990

  # Which branch is allowed to move the `-latest` tag the other repositories
  # consume. Written out rather than taken from a context: the `github` /
  # `forgejo` event payload only carries a default branch on some event types,
  # and a silently empty value here would make every branch `-latest`.
  DEFAULT_BRANCH: master

