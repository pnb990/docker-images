---

logs:
  level: "DEBUG"

# A feature is one snippet of Dockerfile, self-contained: it installs what it
# needs itself, so that it can be used by any image.
features:
  locale: "locale.j2"
  build: "build.j2"
  python: "python.j2"
  uv: "uv.j2"
  arm-13.2.rel1: "arm-none-eabi.j2"
  doxygen: "doxygen.j2"
  ci-runtime: "ci-runtime.j2"
  dev: "dev.j2"
  jlink: "jlink.j2"

# An image is a base image plus, per variant, an ordered list of features.
#
# The order is the layer order, and it is what lets the variants of one image
# share their layers: read the lists below vertically, `base` is a prefix of
# `ci`, which is a prefix of `dev`. Reordering a feature invalidates every
# layer after it and forces a full rebuild and re-push.
images:
  fw-arm-none-eabi-13.2.rel1:
    from: "debian:trixie-slim"
    variants:
      base: [locale, build, python, uv, arm-13.2.rel1]
      ci: [locale, build, python, uv, arm-13.2.rel1, ci-runtime]
      dev: [locale, build, python, uv, arm-13.2.rel1, ci-runtime, dev]
      # Documentation only. It extends `ci` and not `base` because it is meant
      # to be the `container:` of a Forgejo job, and the runner executes the
      # JavaScript actions with the node of the container, which `ci-runtime`
      # carries. It keeps the toolchain because the `doc` target of the
      # projects is a target of their firmware CMake project: reaching it
      # means configuring that project, which needs arm-none-eabi-gcc.
      doc: [locale, build, python, uv, arm-13.2.rel1, ci-runtime, doxygen]
      # Local build only: SEGGER restricts the redistribution of the JLink
      # .deb, so this variant is deliberately absent from the push matrix of
      # .github/workflows/docker-build-and-push.yaml.
      dev-jlink:
        [locale, build, python, uv, arm-13.2.rel1, ci-runtime, dev, jlink]
  python3:
    from: "debian:trixie-slim"
    variants:
      base: [locale, python, uv]
      ci: [locale, python, uv, ci-runtime]
