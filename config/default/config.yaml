---
logs:
  level: "DEBUG"

# A feature is one snippet of Dockerfile, self-contained: it installs what it
# needs itself, so that it can be used by any image.
features:
  locale: "locale.j2"
  build: "build.j2"
  python: "python.j2"
  uv: "uv.j2"
  arm-13.2.rel1: "arm-13.2.rel1.j2"
  arm-15.3.rel1: "arm-15.3.rel1.j2"
  doxygen: "doxygen.j2"
  ci-runtime: "ci-runtime.j2"
  dev: "dev.j2"
  # clang 21 and its tooling (clang-tidy, clang-format, clangd). Stacked
  # right after ci-runtime in every C image, so that CI lints with the same
  # clang-format as the devcontainer.
  clang: "clang.j2"
  # SEGGER restricts the redistribution of the JLink binaries, which is why the
  # .deb was never baked into a layer. This feature instead ships
  # ressources/scripts/install-jlink.sh and an ENTRYPOINT that runs it at
  # container start: the binaries are downloaded at runtime, once each developer
  # accepts the licence, so the image itself carries none of them and stays
  # pushable. That is what lets it sit in every `dev` variant below.
  jlink: "jlink.j2"
  # Newer git (>= 2.48) built from source, for relative-path worktree linking
  # (Debian trixie ships 2.47). Like jlink it switches back to root and
  # returns to the dev user, so it is safe to stack right after `dev`.
  new_git: "new_git.j2"
  x11: "x11.j2"
  pyqt6: "pyqt6.j2"
  # Node LTS from the official tarball into /usr/local, plus typescript, tsx
  # and @vscode/vsce installed globally. Shadows the apt node of ci-runtime.
  node: "node.j2"
  # ESP8266 firmware: Espressif's xtensa-lx106-elf toolchain, ESP8266_RTOS_SDK
  # pinned by commit, and the SDK's python tooling on its own uv-managed
  # interpreter, reached through an `idf.py` wrapper. amd64 only.
  xtensa-lx106: "xtensa-lx106.j2"
  # Build and check Debian packages: build-essential, debhelper, dpkg-dev,
  # lintian, autopkgtest. A package's own Build-Depends are installed by the
  # job.
  debpkg: "debpkg.j2"

# An image is a base image plus, per variant, an ordered list of features.
#
# The order is the layer order, and it is what lets the variants of one image
# share their layers: read the lists below vertically, `base` is a prefix of
# `ci`, which is a prefix of `dev`. Reordering a feature invalidates every
# layer after it and forces a full rebuild and re-push.
images:
  fw-arm-none-eabi-13.2.rel1:
    from: "debian:trixie-slim"
    variants:
      base: [locale, build, python, uv, arm-13.2.rel1]
      ci: [locale, build, python, uv, arm-13.2.rel1, ci-runtime, clang]
      # clang closes `ci`, so every variant below starts with it. new_git then
      # jlink are stacked right after `dev` in every dev-derived variant, so
      # `dev, new_git, jlink` stays their common prefix and the layer sharing
      # described above still holds. jlink adds no binaries, only the runtime
      # installer, so it is cheap to share and safe to push.
      dev:
        [
          locale,
          build,
          python,
          uv,
          arm-13.2.rel1,
          ci-runtime,
          clang,
          dev,
          new_git,
          jlink,
        ]
      # `dev` plus an X11 client stack and tkinter, for the GUI tools of the
      # projects (pnbchrono's tools/sim_panel.py). Stacked after `dev` and
      # not merged into it: it is 11 MB nobody building firmware in CI needs,
      # and stacking keeps `dev` an exact prefix, so the two variants share
      # every layer up to and including `dev`.
      dev-x11:
        [
          locale,
          build,
          python,
          uv,
          arm-13.2.rel1,
          ci-runtime,
          clang,
          dev,
          new_git,
          jlink,
          x11,
        ]
      # `dev-x11` plus Qt 6 and its python bindings, 114 MB more. Same
      # reasoning one step further: `dev-x11` is its exact prefix, so a
      # devcontainer that only needs tkinter never pulls the Qt layer.
      dev-pyqt6:
        [
          locale,
          build,
          python,
          uv,
          arm-13.2.rel1,
          ci-runtime,
          clang,
          dev,
          new_git,
          jlink,
          x11,
          pyqt6,
        ]
      # Documentation only. It extends `ci` and not `base` because it is meant
      # to be the `container:` of a Forgejo job, and the runner executes the
      # JavaScript actions with the node of the container, which `ci-runtime`
      # carries. It keeps the toolchain because the `doc` target of the
      # projects is a target of their firmware CMake project: reaching it
      # means configuring that project, which needs arm-none-eabi-gcc.
      doc:
        [
          locale,
          build,
          python,
          uv,
          arm-13.2.rel1,
          ci-runtime,
          clang,
          doxygen,
        ]
  # Same layout and variants as 13.2.rel1, toolchain aside. Kept side by side
  # so that each project moves to 15.3.rel1 when it chooses to.
  fw-arm-none-eabi-15.3.rel1:
    from: "debian:trixie-slim"
    variants:
      base: [locale, build, python, uv, arm-15.3.rel1]
      ci: [locale, build, python, uv, arm-15.3.rel1, ci-runtime, clang]
      dev:
        [
          locale,
          build,
          python,
          uv,
          arm-15.3.rel1,
          ci-runtime,
          clang,
          dev,
          new_git,
          jlink,
        ]
      dev-x11:
        [
          locale,
          build,
          python,
          uv,
          arm-15.3.rel1,
          ci-runtime,
          clang,
          dev,
          new_git,
          jlink,
          x11,
        ]
      dev-pyqt6:
        [
          locale,
          build,
          python,
          uv,
          arm-15.3.rel1,
          ci-runtime,
          clang,
          dev,
          new_git,
          jlink,
          x11,
          pyqt6,
        ]
      doc:
        [
          locale,
          build,
          python,
          uv,
          arm-15.3.rel1,
          ci-runtime,
          clang,
          doxygen,
        ]
  python3:
    from: "debian:trixie-slim"
    variants:
      base: [locale, python, uv]
      ci: [locale, python, uv, ci-runtime]
      # Devcontainer variant, for python projects that drive hardware (the
      # pi-test-bench bench). It extends `ci` -- which already carries node,
      # npm and git for the JavaScript actions -- with `build` (the C toolchain
      # a `uv sync` may need to compile a wheel) and `dev` (the interactive
      # shell, sudo, udev, openocd, gdb-multiarch, usbutils and the `dev`
      # user). `ci` stays an exact prefix, so the two variants share every
      # layer up to and including ci-runtime. Project-specific packages
      # (can-utils, libusb) and the bench sudoers rule stay in the project's
      # postCreate, not here: this image is meant to stay generic.
      dev: [locale, python, uv, ci-runtime, build, dev, new_git]
  # JavaScript/TypeScript projects and VS Code extensions (pi-test-bench's
  # dashboard and vscode-ext). `node` comes before `ci-runtime` so that `base`
  # stays an exact prefix of `ci`; ci-runtime's apt node is still installed,
  # the runner does not care which one it gets, and /usr/local/bin wins on
  # PATH for everything else.
  node:
    from: "debian:trixie-slim"
    variants:
      base: [locale, node]
      ci: [locale, node, ci-runtime]
      # Devcontainer variant, same recipe as python3's: `ci` plus `build` (for
      # native addons) and `dev` (interactive shell, sudo, the `dev` user),
      # then new_git. `ci` stays an exact prefix.
      dev: [locale, node, ci-runtime, build, dev, new_git]
  # ESP8266 firmware (wifi-nic's coprocessor). Same layout as the arm image:
  # `base` is a prefix of `ci`, a prefix of `dev`, so the toolchain and SDK
  # layers are shared by the three variants.
  fw-xtensa-lx106-esp-2020r3:
    from: "debian:trixie-slim"
    variants:
      base: [locale, build, python, uv, xtensa-lx106]
      ci: [locale, build, python, uv, xtensa-lx106, ci-runtime, clang]
      dev:
        [
          locale,
          build,
          python,
          uv,
          xtensa-lx106,
          ci-runtime,
          clang,
          dev,
          new_git,
        ]
  # Debian packages (yt-add-music-beet, then pi-test-bench), for the
  # deb-build workflow of soft-lib/ci. No `dev` variant: nobody needs one yet.
  debian-pkg:
    from: "debian:trixie-slim"
    variants:
      base: [locale, debpkg]
      ci: [locale, debpkg, ci-runtime]
