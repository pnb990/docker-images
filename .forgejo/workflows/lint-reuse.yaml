---

# Thin caller: the steps live once in soft-lib/ci, this file holds what is
# specific to this project -- the trigger and the image pin.
#
# Its own file, and so its own line in the run list, rather than a step of
# python-checks.yaml: licence headers are not a python matter, and a check
# folded into another job is a check nobody can see ran.

"on":
  push:

jobs:
  lint-reuse:
    # Pinned to a commit, like the image below: a change in soft-lib/ci breaks
    # nothing here until this line is bumped, which is a reviewable commit and
    # a git revert away.
    uses: soft-lib/ci/.github/workflows/lint-reuse.yaml@56c61c009f0c3adea4c9ea57189bc215f1f69e11
    with:
      # See python-checks.yaml for why pinning one of this repository's own
      # images is a bootstrap and not a cycle.
      image: pnb990/python3:ci-6768dd989b373e25b6ef4462ecd0503ae498bd3c

      # No submodules in this repository.
      submodules: "false"

      # `pinned` is left at its default, true: reuse is a dev dependency of
      # this project, so the version that lints here is the one in uv.lock and
      # the one a developer gets locally.
