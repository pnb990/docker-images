---
name: build-docker-image

"on":
  push:

jobs:
  prepare:
    runs-on: STM32
    outputs:
      generated_files: ${{ steps.images_list.outputs.files }}

    steps:
      - uses: actions/checkout@v4

      - name: Install pipenv
        run: apt-get update && apt-get install -y pipenv jq

      - name: Install dependencies
        run: pipenv install --deploy

      - name: Clean images directory
        run: rm -rf images/

      - name: Generate matrix of Dockerfiles
        run: pipenv run python3 ./src/main.py

      - name: List generated Dockerfiles
        id: images_list
        run: |
          files=$(printf '%s\n' images/*.Dockerfile )
          echo "files=${{ toJSON($files) }}"
          echo "files=\"$files\""
          echo "files=\"$files\"" >> $FORGEJO_OUTPUT

#           echo "Generated files: $files"
#           cat $FORGEJO_OUTPUT
#           echo "----------------"

#           echo "files=value1" >> $FORGEJO_OUTPUT
#           set -x
#           jq . "$FORGEJO_OUTPUT"

      - name: Commit generated Dockerfiles
        run: |
          git config user.name "Forgejo Actions"
          git config user.email "actions@forgejo.local"

          git add images/*.Dockerfile

          if ! git diff --cached --quiet; then
            git commit -m "Auto-generate Dockerfiles"
            git push origin HEAD
          else
            echo "No changes to commit"
          fi


  build:
    runs-on: STM32

    needs:
      - prepare

    strategy:
      matrix:
        file: ${{ needs.prepare.outputs.generated_files }}

    steps:
      - name: HARD DEBUG JOB
        run: |
          echo "JOB files = ${{ needs.prepare.outputs.generated_files }}"

      - name: Debug matrix
        run: |
          echo "matrix.files=${{ matrix.files }}"

      - name: Fail if matrix is empty
        if: ${{ matrix.file == '' }}
        run: |
          echo "Matrix is empty – no Dockerfiles to build"
          exit 1

      - name: Install docker-cli
        run: |
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg \
              -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc

          tee /etc/apt/sources.list.d/docker.sources <<EOF
          Types: deb
          URIs: https://download.docker.com/linux/debian
          Suites: $(. /etc/os-release && echo "$VERSION_CODENAME")
          Components: stable
          Signed-By: /etc/apt/keyrings/docker.asc
          EOF

          apt-get update
          apt-get install -y docker-ce-cli jq

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image name from Dockerfile
        id: img
        run: |
          echo "matrix.file ${{ matrix.file }}"
          fname=$(basename "${{ matrix.file }}")
          image="${fname%.Dockerfile}"
          echo "name=$image" >> $FORGEJO_OUTPUT
          echo "Image ${{ matrix.file }} => name: $image"

      - name: Get commit hash for Dockerfile
        id: file_commit
        run: |
          commit=$(git log -n 1 --format=%h -- "${{ matrix.file }}")
          echo "commit=$commit" >> $FORGEJO_OUTPUT

      - name: Generate Docker tags
        id: tags
        run: |
          repo="${{ secrets.DOCKER_HUB_USERNAME }}/test"
          name="${{ steps.img.outputs.name }}"
          commit="${{ steps.file_commit.outputs.commit }}"

          {
            echo "tags<<EOF"
            echo "$repo:$name"
            echo "$repo:$name-$commit"
            echo "EOF"
          } >> $FORGEJO_OUTPUT

      - name: Login to Docker Hub
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build & Push image
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
