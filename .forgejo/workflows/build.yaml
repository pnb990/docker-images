---
name: build-docker-image

"on":
  push:

jobs:
  prepare:
    runs-on: STM32
    outputs:
      dockerfiles: ${{ steps.images_list.outputs.files }}

    steps:
      - uses: actions/checkout@v4

      - name: Install pipenv
        run: apt-get update && apt-get install -y pipenv jq

      - name: Install dependencies
        run: pipenv install --deploy

      - name: Clean images directory
        run: rm -rf images/

      - name: Generate matrix of Dockerfiles
        run: pipenv run python3 ./src/main.py

      - name: List generated Dockerfiles
        id: images_list
        run: |
          files=$(printf '"%s"\n' images/*.Dockerfile | jq -R . | jq -s .)
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$FORGEJO_OUTPUT"
          cat "$FORGEJO_OUTPUT"

      - name: Commit generated Dockerfiles
        run: |
          git config user.name "Forgejo Actions"
          git config user.email "actions@forgejo.local"

          git add images/*.Dockerfile

          if ! git diff --cached --quiet; then
            git commit -m "Auto-generate Dockerfiles"
            git push origin HEAD
          else
            echo "No changes to commit"
          fi


  build:
    runs-on: host

    needs:
      - prepare

    strategy:
      matrix:
        # file: ${{ fromJSON(needs.prepare.outputs.dockerfiles) }} not working
        name: ["fw-arm-none-eabi"]
        variant: [base, ci]

    steps:
      - name: Debug matrix
        run: |
          echo "matrix.name=${{ matrix.name }}"
          echo "matrix.variant=${{ matrix.variant }}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get commit hash for Dockerfile
        id: file_commit
        run: |
          file="images/${{ matrix.name }}.${{ matrix.variant }}.Dockerfile"
          commit=$(git log -n 1 --format=%h -- "$file")
          {
            echo "commit=$commit"
            echo "dockerfile=$file"
          } >> $FORGEJO_OUTPUT

      - name: Extract image name from Dockerfile
        id: img
        run: |
          name="${{ matrix.name }}"
          branch_head=$(git rev-parse HEAD)
          repo="${{ secrets.DOCKER_HUB_USERNAME }}/${{ matrix.name }}"
          commit="${{ steps.file_commit.outputs.commit }}"
          {
            echo "tags<<EOF"
            echo "$repo:$name"
            echo "$repo:$name-$FORGEJO_REF_NAME"
            echo "$repo:$name-$commit"
            echo "EOF"
          } >> $FORGEJO_OUTPUT
          cat "$FORGEJO_OUTPUT"

      - name: Login to Docker Hubs
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build & Push image
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ steps.file_commit.outputs.dockerfile }}
          push: true
          tags: ${{ steps.img.outputs.tags }}
