name: build-airflow-image

on:
  push:
#     tags:
#       - release-*
#     paths:
#       - images/test.Dockerfile

env:
  IMAGE_NAME: test
  IMAGE_PATH: images/${{ env.IMAGE_NAME }}.Dockerfile

jobs:
  build:
    runs-on: STM32
    steps:
      - name: Install docker-cli
        run: |
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc

          tee /etc/apt/sources.list.d/docker.sources <<EOF
          Types: deb
          URIs: https://download.docker.com/linux/debian
          Suites: $(. /etc/os-release && echo "$VERSION_CODENAME")
          Components: stable
          Signed-By: /etc/apt/keyrings/docker.asc
          EOF

          apt-get update
          # apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          apt-get install -y docker-ce-cli

      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Export GitHub env variables
        run: export

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract the correct tag
        id: extract_tag
        run: echo "::set-output name=tag::$(echo ${{ env.GITHUB_REF_NAME }})"
        #run: echo "::set-output name=tag::$(echo ${{ env.GITHUB_REF_NAME }} | grep -oP '(?<=airflow-v)[^/]+')"

      - name: Display extracted tag
        run: echo "Extracted tag is '${{ steps.extract_tag.outputs.tag }}'"

      - name: Set the correct tag in Dockerfile
        run: sed -i 's/AIRFLOW_VERSION_PLACEHOLDER/3.14/' ${{ env.IMAGE_PATH }}

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          #registry: harbor.tech-tales.blog
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.extract_tag.outputs.tag }}
          context: .
          file: ${{ env.IMAGE_PATH }}
