  build-images:
    runs-on: host

    # needs:
    #   - prepare

    strategy:
      # One job per image, its variants built in order inside it. The order
      # used to come from `max-parallel: 1` over (name, variant) pairs, but the
      # runner does not honour it: run 3443 built dev, dev-x11, dev-pyqt6 and
      # doc of the same image at once, each one compiling git again, none
      # finding the cache entry the previous variant was meant to write. A loop
      # in one job is an order nothing can override, and its single builder
      # shares the common prefix through its local cache, with no registry
      # round trip.
      #
      # Two images share no layer, so their jobs may run side by side.
      matrix:
        # `variants` is in build order: a variant comes after the one whose
        # layers it extends (dev-x11 after dev, dev-pyqt6 after dev-x11). The
        # entries are the `name`/`variant` fields of images/images_list.json;
        # keep them in sync (a dynamic matrix needs a `prepare` job, see the
        # commented block above).
        include:
          - name: "fw-arm-none-eabi-13.2.rel1"
            variants: "base ci dev dev-x11 dev-pyqt6 doc"
          - name: "fw-arm-none-eabi-15.3.rel1"
            variants: "base ci dev dev-x11 dev-pyqt6 doc"
          # python3 has no arm-derived dev-x11/dev-pyqt6/doc.
          - name: "python3"
            variants: "base ci dev"
          - name: "node"
            variants: "base ci dev"
          - name: "fw-xtensa-lx106-esp-2020r3"
            variants: "base ci dev"
          - name: "debian-pkg"
            variants: "base ci dev"

    steps:
      - name: Debug matrix
        run: |
          echo "matrix.name=${{ matrix.name }}"
          echo "matrix.variants=${{ matrix.variants }}"

      # buildx keeps its builder state in $DOCKER_CONFIG/buildx, and the login
      # writes its credentials there. Every step must see the same directory:
      # when only the login and build steps had it, `Setup Docker Buildx`
      # wrote to ~/.docker, the build step found no builder and fell back to
      # the `docker` driver, which cannot export a cache.
      #
      # Exported here rather than in the job `env:` because the `runner`
      # context is not available at that level.
      - name: Setup docker config dir
        run: echo "DOCKER_CONFIG=${RUNNER_TEMP:-/tmp}/docker" >> "$FORGEJO_ENV"

      # fetch-depth 0, the full history, and it is not an optimisation to
      # revisit: the build step asks `git log -- <file>` which commit last
      # touched a Dockerfile, and that question needs commits to walk back
      # through. At the default depth of 1 the clone holds exactly HEAD, so
      # the only answer it can give is HEAD -- which is what happened for
      # months: every push to master republished a new immutable tag for a
      # byte-identical image, and the tag every project pins, ci-6768dd9, is a
      # merge commit that never touched python3.ci.Dockerfile.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # docker-container, not the default `docker` driver: exporting a
      # registry cache is only supported by the former.
      #
      # `id` so the build step can name this builder, and the cleanup step at
      # the end of the job remove it: the action generates a fresh
      # `builder-<uuid>` per job and only its own outputs know which one.
      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Login to Docker Hubs
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      # A shell loop rather than docker/build-push-action, which builds one
      # image per step and a step cannot be repeated over a list.
      - name: Build & Push images
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.name }}
          VARIANTS: ${{ matrix.variants }}
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          set -euo pipefail

          repo="$IMAGE_NAMESPACE/$IMAGE_NAME"

          # A docker tag cannot contain a slash, and branch names do:
          # `tmp/review_image_building` would give the invalid tag
          # `base-tmp/review_image_building`.
          branch=$(printf '%s' "$FORGEJO_REF_NAME" | tr '/' '-')

          # The moving tags describe what the default branch currently says an
          # image is, so the only question is which branch is building. It used
          # to be `file_commit = branch_head`, which was wrong twice: a push of
          # several commits whose Dockerfile change is not the head commit left
          # `-latest` frozen on the previous image forever, and a work branch
          # whose head commit did touch a Dockerfile published `-latest` from
          # outside the default branch.
          if [ "$FORGEJO_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            is_latest=true
          else
            is_latest=false
          fi

          echo "Branch head    : $(git rev-parse HEAD)"
          echo "Branch         : $FORGEJO_REF_NAME"
          echo "Default branch : $DEFAULT_BRANCH"
          echo "Is latest      : $is_latest"

          for variant in $VARIANTS; do
            file="images/$IMAGE_NAME.$variant.Dockerfile"

            # The commit that last touched this Dockerfile or a file it
            # COPYs, not HEAD: it is the identity of the image content, so the
            # immutable `-<commit>` tag stays the same across pushes that do
            # not change the image. The Dockerfile alone is not enough: a
            # change to a copied script alone would push a different image
            # under the same immutable tag. An array, so that an image with
            # no COPY passes no path at all: an empty string is an invalid
            # pathspec and fails `git log`.
            mapfile -t sources < <(awk '$1 == "COPY" {
                for (i = 2; i < NF; i++) if ($i !~ /^--/) print $i
              }' "$file")
            file_commit=$(git log -n 1 --format=%H -- "$file" "${sources[@]}")
            # Two forms of the same commit date, one per consumer, and both
            # taken from the commit rather than from `date`: a build time
            # would change on every rebuild and destroy the very property the
            # line above exists for.
            #
            #   file_date      YYYYMMDD, for the image tag -- a tag may not
            #                  contain ':' or '+', and it is read by eye;
            #   file_date_iso  RFC 3339, for /etc/image-info and for the
            #                  org.opencontainers.image.created label, which
            #                  the OCI spec defines as an RFC 3339 date-time.
            file_date=$(git log -n 1 --format=%cs "$file_commit" | tr -d '-')
            file_date_iso=$(git log -n 1 --format=%cI "$file_commit")

            # Four kinds of tag:
            #   -<date>-<commit>  immutable, what consumers pin;
            #   -<commit>         the same image, without the date, kept so
            #                     the pins written before the date existed
            #                     keep resolving;
            #   -<branch>         per branch, so a work branch can be tried
            #                     out;
            #   -latest and the bare <variant> alias, moving, default branch
            #                     only -- a work branch must never be able to
            #                     move what the other repositories consume.
            #
            # The date is there because a commit hash has no order. Two pins
            # cannot be compared by eye, and the question a pin raises is
            # always "am I behind?" -- which `ci-20260822-53142d0...` answers
            # at a glance and `ci-53142d0...` does not. It is the commit's own
            # date, so an unchanged image keeps the same tag, exactly like the
            # hash.
            tags=(
              "$repo:${variant}-$branch"
              "$repo:${variant}-${file_date}-$file_commit"
              "$repo:${variant}-$file_commit"
            )
            if [ "$is_latest" = true ]; then
              tags+=("$repo:${variant}" "$repo:${variant}-latest")
            fi

            echo "::group::$IMAGE_NAME:$variant"
            echo "Dockerfile        : $file"
            echo "Dockerfile commit : $file_commit"
            echo "Dockerfile date   : $file_date_iso"
            printf 'tag               : %s\n' "${tags[@]}"

            tag_args=()
            for tag in "${tags[@]}"; do
              tag_args+=(--tag "$tag")
            done

            # IMAGE_COMMIT/IMAGE_DATE are stamped into /etc/image-info by the
            # last layer of every Dockerfile. Without them a job running on a
            # floating tag leaves no trace of the image it ran in, and a green
            # run cannot be turned back into a pin.
            #
            # One registry cache entry per variant: a `mode=max` export holds
            # the layers of that one build, so a single entry per image was
            # overwritten by each variant in turn and the next run only found
            # the last one's. Within this job the variants already share their
            # prefix through the builder's local cache; the registry entry is
            # what carries it to the next run. Identical instructions do not
            # produce identical layers -- a rebuilt layer gets a fresh digest
            # and is stored again -- so a cache hit is what keeps the variants
            # on the very same blobs.
            docker buildx build \
              --builder "$BUILDER" \
              --file "$file" \
              "${tag_args[@]}" \
              --build-arg "IMAGE_COMMIT=$file_commit" \
              --build-arg "IMAGE_DATE=$file_date_iso" \
              --attest "type=provenance,mode=max,builder-id=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --cache-from "type=registry,ref=$repo:buildcache-$variant" \
              --cache-to "type=registry,mode=max,ref=$repo:buildcache-$variant" \
              --push \
              .
            echo "::endgroup::"
          done

      # Every job creates its own builder above, and each one costs a
      # buildkitd container plus a `buildx_buildkit_<name>_state` volume. The
      # action has a post-step meant to remove it; it did not. 71 of them
      # accumulated to 101.6 GB, filled /var, and took PostgreSQL down on
      # 2026-08-25 with a checkpointer PANIC on ENOSPC. This step no longer
      # depends on that post-step running.
      #
      # An 8-image matrix on `on: push` with no branch filter leaks 8 builders
      # per push when it goes wrong, which is how it got to 71 in nine pushes.
      #
      # `always()` is the whole point: without it the step is skipped in
      # exactly the case that leaks, a failed build -- every orphaned builder
      # container was in `Exited (1)`. `|| true` keeps a failed cleanup from
      # failing a build that otherwise passed.
      - name: Remove the buildx builder
        if: always()
        run: docker buildx rm --force "${{ steps.buildx.outputs.name }}" || true
